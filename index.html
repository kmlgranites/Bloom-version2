.bd-sso{transition:background .15s}

@keyframes bdflow{0%{transform:translateX(-14px);opacity:0}30%{opacity:1}70%{opacity:1}100%{transform:translateX(14px);opacity:0}}
.bd-flowdot{position:absolute;bottom:-4px;left:50%;width:3px;height:3px;margin-left:-1.5px;border-radius:50%;background:#0BB3B3;animation:bdflow 1.8s ease-in-out infinite}
.bd-framed > div:last-child{border:none!important;border-radius:0!important}
@keyframes bdspin{to{transform:rotate(360deg)}}
@keyframes bdpulse{0%,100%{opacity:1}50%{opacity:.35}}
.bd-spin{animation:bdspin .7s linear infinite}
